# Phase 1 — Motus finetune on VLA-rollout data (joint video + action).
# Uses the native trainer: train/train.py + models/motus.training_step.
# Freezes VLM(Qwen3-VL)/VAE/T5; trains WAN video diffusion + action expert + und expert.

# Top-level training mode (consumed by train.py: partial-init from finetune.checkpoint_path)
training_mode: finetune

common:
  action_dim: 14
  state_dim: 14

  num_video_frames: 8
  video_height: 384
  video_width: 320

  # Motus video grid: chunk = num_video_frames * video_action_freq_ratio = 16;
  # raw future steps within a chunk = [6,12,...,48] (must match the collection worker).
  global_downsample_rate: 3
  video_action_freq_ratio: 2

# Dataset: VLA-rollout npz collected by RoboTwin/script/rl_rollout_worker.py
dataset:
  type: "vla_rollout"
  dataset_dir: "/mnt/data14/yyg/wrm_rl_runs/motus_v1"   # <-- collected data root
  # lang_cache_path: null   # defaults to <dataset_dir>/lang_cache.pt (build with scripts/build_lang_cache.py)
  max_episodes: null
  image_aug: false

model:
  wan:
    config_path: "/share/home/bhz/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/share/home/bhz/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/share/home/bhz/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/share/home/bhz/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 8
  max_steps: 100000
  learning_rate: 5.0e-5
  wan_learning_rate: 5.0e-5
  weight_decay: 0.01

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints_motus_finetune"
  log_level: "INFO"
  log_interval: 1
  save_interval: 5000
  val_interval: 500
  num_workers: 8
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus_finetune"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

resume:
  checkpoint_path: null

# Partial-init from the pretrained Motus checkpoint (directory with mp_rank_00_model_states.pt)
finetune:
  checkpoint_path: "/mnt/data14/yyg/Motus/pretrained/Motus_robotwin2"   # <-- pretrained Motus ckpt dir
