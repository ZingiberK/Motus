# Smoke: 1 GPU, few steps, tiny subset — verify joint video+action loss.
# Launch: NPROC=1 bash scripts/train_finetune_smoke.sh

training_mode: finetune

common:
  action_dim: 14
  state_dim: 14
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2

dataset:
  type: "vla_rollout"
  dataset_dir: "/path/to/HELIX/wrm_rl_runs/motus_v1_smoke"
  max_episodes: null
  image_aug: false

model:
  wan:
    config_path: "/path/to/HELIX/pretrained/Wan2.2-TI2V-5B"
    checkpoint_path: "/path/to/HELIX/pretrained/Wan2.2-TI2V-5B"
    vae_path: "/path/to/HELIX/pretrained/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"
  vlm:
    checkpoint_path: "/path/to/HELIX/pretrained/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"
  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 1
  max_steps: 20
  # Slightly lower LR than Stage-3 default for smoke stability on tiny subset.
  learning_rate: 1.0e-5
  wan_learning_rate: 1.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 10
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints_motus_finetune_smoke"
  log_level: "INFO"
  log_interval: 1
  save_interval: 10000
  val_interval: 10000
  num_workers: 2
  pin_memory: true

logging:
  report_to: "tensorboard"
  wandb_project: "motus_finetune_smoke"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "motus_finetune_smoke"

resume:
  checkpoint_path: null

finetune:
  checkpoint_path: "/path/to/HELIX/pretrained/Motus_robotwin2"
